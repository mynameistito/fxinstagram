name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || 'invalid' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Run Alchemy deployment
        # Pin the published action release immutably.
        uses: mynameistito/alchemy-deploy@1b495c668753637a7820112cea1773b8878fd4b9 # v3.1.2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: fxinstagram
          deploy-command: bun ./node_modules/alchemy/bin/cli.js deploy alchemy.run.ts --stage "$STAGE" --yes
          destroy-command: bun ./node_modules/alchemy/bin/cli.js destroy alchemy.run.ts --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://ig.mynameistito.com
          use-adopt: false
          preview-artifact: alchemy-worker
          preview-entrypoint: worker/index.js
          worker-config: '{"ALLOWED_MEDIA_HOSTS":"scontent.cdninstagram.com","METADATA_CACHE_TTL_SECONDS":"60","METADATA_TIMEOUT_MS":"5000","PUBLIC_ORIGIN":"https://ig.mynameistito.com"}'
