name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_target:
    types: [closed]

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'pull_request_target' && github.event.action == 'closed')
    runs-on: ubuntu-24.04
    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'pull_request_target' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || 'invalid' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Check current pull request state before cleanup
        id: current-pr
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          for attempt in 1 2 3; do
            if state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state); then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Failed to check the current pull request state" >&2
              exit 1
            fi
            sleep "$attempt"
          done
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Run Alchemy deployment
        # A reopen after the check can still race cleanup; the action must recheck at destruction.
        if: github.event_name != 'pull_request_target' || steps.current-pr.outputs.state == 'closed'
        # Pin the published action release immutably.
        uses: mynameistito/alchemy-deploy@4e29a36d61cf8cc4277bdcd35d7b3eff13150b38 # v3.2.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: fxinstagram
          deploy-command: bun ./node_modules/alchemy/bin/cli.js deploy alchemy.run.ts --stage "$STAGE" --yes
          destroy-command: bun ./node_modules/alchemy/bin/cli.js destroy alchemy.run.ts --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://ig.mynameistito.com
          use-adopt: false
          preview-artifact: alchemy-worker
          preview-entrypoint: worker/index.js
          worker-config: '{"ALLOWED_MEDIA_HOSTS":"scontent.cdninstagram.com","METADATA_CACHE_TTL_SECONDS":"60","METADATA_TIMEOUT_MS":"5000","PUBLIC_ORIGIN":"https://ig.mynameistito.com"}'
