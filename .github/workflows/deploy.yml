name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || github.event.workflow_run.event == 'push' && 'prod' || 'invalid' }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Run Alchemy deployment
        # Pin the published action release immutably.
        uses: mynameistito/alchemy-deploy@d3525f8fb0344b44e92bda49a6a7efd84584e108 # state-store planning retry
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: fxinstagram
          deploy-command: bunx --no-install alchemy deploy alchemy.run.ts --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy alchemy.run.ts --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://ig.mynameistito.com
          use-adopt: false
