name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: bun run check
          - name: Typecheck
            command: bun run typecheck
          - name: Unit tests
            command: bun run test:unit
          - name: E2E tests
            command: bun run test:e2e
          - name: Validate Alchemy stack
            command: bun run alchemy:check
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - run: ${{ matrix.command }}

  preview-artifact:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Bundle the Worker without deployment credentials
        run: |
          mkdir -p "$RUNNER_TEMP/alchemy-worker/worker"
          bun build src/runtime/worker.ts --target browser --outfile "$RUNNER_TEMP/alchemy-worker/worker/index.js"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alchemy-worker
          path: ${{ runner.temp }}/alchemy-worker/
          if-no-files-found: error
