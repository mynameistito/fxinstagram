name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [closed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: alchemy-deploy-${{ github.event_name == 'workflow_run' && 'prod' || format('pr-{0}', github.event.pull_request.number) }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Run Alchemy deployment
        # v2.1.0 workflow_run preview deployment.
        uses: mynameistito/alchemy-deploy@ff58d7e5a05568eb801ab4df556df43502aef680 # v2.1.0
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          worker-name: fxinstagram
          deploy-command: bunx --no-install alchemy deploy alchemy.run.ts --stage "$STAGE" --yes
          destroy-command: bunx --no-install alchemy destroy alchemy.run.ts --stage "$STAGE" --yes
          production-stage: prod
          production-url: https://ig.mynameistito.com
          use-adopt: false
